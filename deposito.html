<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Depósito Central — Isumos</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100dvh;
      margin: 0;
    }

    /* ── Header ── */
    .header {
      position: sticky; top: 0; z-index: 100;
      height: var(--header-height);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 var(--space-6);
      gap: var(--space-4);
    }
    .header__logo {
      display: flex; align-items: center; gap: var(--space-2);
      font-size: var(--text-lg); font-weight: var(--font-bold);
      color: var(--accent);
    }
    .header__logo img { height: 32px; }
    .header__title {
      font-size: var(--text-base); font-weight: var(--font-semibold);
      color: var(--text-secondary);
    }
    .header__sep { flex: 1; }
    .header__user {
      font-size: var(--text-sm); color: var(--text-muted);
      display: flex; align-items: center; gap: var(--space-2);
    }
    .btn-logout {
      font-size: var(--text-sm); font-weight: var(--font-medium);
      color: var(--text-secondary); background: none; border: 1px solid var(--border);
      border-radius: var(--radius); padding: var(--space-2) var(--space-3);
      cursor: pointer; transition: background var(--transition);
    }
    .btn-logout:hover { background: var(--bg-subtle); }

    /* ── Main layout ── */
    .main { max-width: 1100px; margin: 0 auto; padding: var(--space-8) var(--space-6); }

    /* ── Stats row ── */
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: var(--space-4); margin-bottom: var(--space-8);
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: var(--space-5);
    }
    .stat-card__label { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-1); }
    .stat-card__value { font-size: var(--text-2xl); font-weight: var(--font-bold); }
    .stat-card--pending  .stat-card__value { color: var(--warning); }
    .stat-card--prep     .stat-card__value { color: var(--accent); }
    .stat-card--dispatch .stat-card__value { color: var(--info); }
    .stat-card--done     .stat-card__value { color: var(--success); }

    /* ── Toolbar ── */
    .toolbar {
      display: flex; gap: var(--space-3); align-items: center;
      flex-wrap: wrap; margin-bottom: var(--space-5);
    }
    .filter-btn {
      font-size: var(--text-sm); font-weight: var(--font-medium);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full); border: 1px solid var(--border);
      background: var(--surface); color: var(--text-secondary);
      cursor: pointer; transition: all var(--transition);
    }
    .filter-btn:hover  { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .toolbar__sep { flex: 1; }
    .btn-refresh {
      font-size: var(--text-sm); font-weight: var(--font-medium);
      padding: var(--space-2) var(--space-4); border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-secondary); cursor: pointer; transition: background var(--transition);
      display: flex; align-items: center; gap: var(--space-2);
    }
    .btn-refresh:hover { background: var(--bg-subtle); }
    .btn-refresh svg { width: 16px; height: 16px; }

    /* ── Orders list ── */
    .orders-list { display: flex; flex-direction: column; gap: var(--space-3); }

    .order-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); overflow: hidden;
      transition: box-shadow var(--transition);
    }
    .order-card:hover { box-shadow: var(--shadow-md); }

    .order-card__header {
      display: flex; align-items: center; gap: var(--space-4);
      padding: var(--space-4) var(--space-5);
      cursor: pointer; user-select: none;
    }
    .order-card__id {
      font-size: var(--text-xs); font-family: var(--font-mono);
      color: var(--text-muted); min-width: 180px;
    }
    .order-card__sucursal {
      font-size: var(--text-sm); font-weight: var(--font-semibold); flex: 1;
    }
    .order-card__meta {
      font-size: var(--text-xs); color: var(--text-muted);
    }
    .order-card__toggle {
      width: 20px; height: 20px; color: var(--text-muted);
      transition: transform var(--transition);
    }
    .order-card.is-open .order-card__toggle { transform: rotate(180deg); }

    /* ── Estado badge + selector ── */
    .estado-badge {
      display: inline-flex; align-items: center; gap: var(--space-1);
      font-size: var(--text-xs); font-weight: var(--font-medium);
      padding: 2px var(--space-2); border-radius: var(--radius-full);
      white-space: nowrap;
    }
    .estado-badge--pendiente  { background: var(--warning-light);  color: var(--warning); }
    .estado-badge--preparando { background: var(--accent-light);   color: var(--accent); }
    .estado-badge--despachado { background: var(--info-light);     color: var(--info); }
    .estado-badge--recibido   { background: var(--success-light);  color: var(--success); }

    .estado-select {
      font-size: var(--text-xs); font-weight: var(--font-medium);
      padding: 2px var(--space-2); border-radius: var(--radius-full);
      border: 1px solid var(--border); cursor: pointer;
      background: var(--surface); color: var(--text-primary);
      transition: border-color var(--transition);
    }
    .estado-select:hover { border-color: var(--accent); }

    /* ── Order body ── */
    .order-card__body {
      display: none; border-top: 1px solid var(--border);
      padding: var(--space-4) var(--space-5);
    }
    .order-card.is-open .order-card__body { display: block; }

    .items-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
    .items-table th {
      text-align: left; font-size: var(--text-xs); font-weight: var(--font-semibold);
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em;
      padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border);
    }
    .items-table td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--bg-subtle); }
    .items-table tr:last-child td { border-bottom: none; }
    .items-table .qty { font-weight: var(--font-semibold); text-align: right; }
    .badge-ctrl {
      font-size: 10px; font-weight: var(--font-semibold);
      background: var(--danger-light); color: var(--danger);
      padding: 1px 5px; border-radius: var(--radius-full);
    }

    /* ── Empty / loading ── */
    .empty-state {
      text-align: center; padding: var(--space-16);
      color: var(--text-muted); font-size: var(--text-sm);
    }
    .empty-state svg { width: 48px; height: 48px; margin: 0 auto var(--space-4); display: block; opacity: .3; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 20px; height: 20px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite; display: inline-block;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header__logo">
      <img src="assets/img/logo-global.png" alt="Farmacias Global">
    </div>
    <span class="header__title">/ Depósito Central</span>
    <div class="header__sep"></div>
    <a href="./admin.html" style="font-size:var(--text-sm);font-weight:var(--font-medium);color:var(--text-secondary);text-decoration:none;padding:var(--space-2) var(--space-3);border:1px solid var(--border);border-radius:var(--radius);">
      Catálogo
    </a>
    <span id="sse-indicator" title="Conexión en tiempo real" style="width:8px;height:8px;border-radius:50%;background:var(--border);display:inline-block;margin-left:4px;"></span>
    <span class="header__user" id="header-user"></span>
    <button class="btn-logout" id="btn-logout">Salir</button>
  </header>

  <!-- Main -->
  <main class="main">

    <!-- Stats -->
    <div class="stats" id="stats">
      <div class="stat-card stat-card--pending">
        <div class="stat-card__label">Pendientes</div>
        <div class="stat-card__value" id="stat-pendiente">—</div>
      </div>
      <div class="stat-card stat-card--prep">
        <div class="stat-card__label">En preparación</div>
        <div class="stat-card__value" id="stat-preparando">—</div>
      </div>
      <div class="stat-card stat-card--dispatch">
        <div class="stat-card__label">Despachados</div>
        <div class="stat-card__value" id="stat-despachado">—</div>
      </div>
      <div class="stat-card stat-card--done">
        <div class="stat-card__label">Recibidos</div>
        <div class="stat-card__value" id="stat-recibido">—</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button class="filter-btn active" data-estado="">Todos</button>
      <button class="filter-btn" data-estado="pendiente">Pendientes</button>
      <button class="filter-btn" data-estado="preparando">En preparación</button>
      <button class="filter-btn" data-estado="despachado">Despachados</button>
      <button class="filter-btn" data-estado="recibido">Recibidos</button>
      <div class="toolbar__sep"></div>
      <button class="btn-refresh" id="btn-refresh">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
        Actualizar
      </button>
    </div>

    <!-- Orders -->
    <div class="orders-list" id="orders-list">
      <div class="empty-state"><span class="spinner"></span></div>
    </div>

  </main>

  <script type="module">
    import auth    from './js/auth.js';
    import storage from './js/storage.js';

    let currentFilter = '';
    let allOrders = [];

    // ── Auth guard ──────────────────────────────────────────────
    const session = await auth.requireAuth();
    if (!session) throw new Error('no session');
    if (session.rol !== 'deposito') {
      window.location.href = './index.html';
      throw new Error('sin permiso');
    }

    document.getElementById('header-user').textContent = session.usuario;
    document.getElementById('btn-logout').addEventListener('click', () => auth.logout());

    // ── Cargar pedidos ──────────────────────────────────────────
    async function loadOrders() {
      document.getElementById('orders-list').innerHTML =
        '<div class="empty-state"><span class="spinner"></span></div>';
      try {
        allOrders = await storage.getAllOrders();
        renderStats(allOrders);
        renderOrders(filterOrders(allOrders, currentFilter));
      } catch (err) {
        document.getElementById('orders-list').innerHTML =
          '<div class="empty-state">Error al cargar pedidos. Intentá de nuevo.</div>';
      }
    }

    function filterOrders(orders, estado) {
      return estado ? orders.filter(o => o.estado === estado) : orders;
    }

    // ── Stats ───────────────────────────────────────────────────
    function renderStats(orders) {
      const counts = { pendiente: 0, preparando: 0, despachado: 0, recibido: 0 };
      orders.forEach(o => { if (o.estado in counts) counts[o.estado]++; });
      Object.entries(counts).forEach(([k, v]) => {
        document.getElementById(`stat-${k}`).textContent = v;
      });
    }

    // ── Render orders ───────────────────────────────────────────
    function renderOrders(orders) {
      const list = document.getElementById('orders-list');
      if (!orders.length) {
        list.innerHTML = `<div class="empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25Z" />
          </svg>
          No hay pedidos${currentFilter ? ' con este estado' : ''}.
        </div>`;
        return;
      }
      list.innerHTML = orders.map(o => orderCardHTML(o)).join('');
      list.querySelectorAll('.order-card__header').forEach(h => {
        h.addEventListener('click', e => {
          if (e.target.closest('.estado-select')) return;
          h.closest('.order-card').classList.toggle('is-open');
        });
      });
      list.querySelectorAll('.estado-select').forEach(sel => {
        sel.addEventListener('change', async e => {
          const orderId = e.target.dataset.orderId;
          const nuevo   = e.target.value;
          try {
            await storage.updateOrderState(orderId, nuevo);
            const order = allOrders.find(o => o.id === orderId);
            if (order) order.estado = nuevo;
            renderStats(allOrders);
            // Actualizar solo el badge del header sin re-renderizar todo
            const card = e.target.closest('.order-card');
            card.querySelector('.estado-badge').className = `estado-badge estado-badge--${nuevo}`;
            card.querySelector('.estado-badge').textContent = LABELS[nuevo];
          } catch {
            alert('No se pudo actualizar el estado. Intentá de nuevo.');
            e.target.value = allOrders.find(o => o.id === orderId)?.estado;
          }
        });
      });
    }

    const LABELS = {
      pendiente: 'Pendiente', preparando: 'Preparando',
      despachado: 'Despachado', recibido: 'Recibido',
    };
    const ESTADOS = ['pendiente', 'preparando', 'despachado', 'recibido'];

    function orderCardHTML(o) {
      const fecha = new Date(o.fecha).toLocaleString('es-AR', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit',
      });
      const opts = ESTADOS.map(e =>
        `<option value="${e}"${e === o.estado ? ' selected' : ''}>${LABELS[e]}</option>`
      ).join('');

      const rows = o.items.map(i => `
        <tr>
          <td>${i.nombre} ${i.es_controlado ? '<span class="badge-ctrl">Controlado</span>' : ''}</td>
          <td>${i.presentacion ?? ''}</td>
          <td>${i.categoria ?? ''}</td>
          <td class="qty">${i.qty} ${i.unidad_pedido ?? ''}</td>
        </tr>`).join('');

      return `
        <div class="order-card">
          <div class="order-card__header">
            <span class="order-card__id">${o.id}</span>
            <span class="order-card__sucursal">${o.sucursal_nombre}</span>
            <span class="order-card__meta">${fecha}</span>
            <span class="estado-badge estado-badge--${o.estado}">${LABELS[o.estado]}</span>
            <select class="estado-select" data-order-id="${o.id}" title="Cambiar estado">${opts}</select>
            <svg class="order-card__toggle" xmlns="http://www.w3.org/2000/svg" fill="none"
              viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="m19 9-7 7-7-7" />
            </svg>
          </div>
          <div class="order-card__body">
            <table class="items-table">
              <thead><tr>
                <th>Producto</th><th>Presentación</th><th>Categoría</th><th style="text-align:right">Cantidad</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>`;
    }

    // ── Filtros ─────────────────────────────────────────────────
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.estado;
        renderOrders(filterOrders(allOrders, currentFilter));
      });
    });

    document.getElementById('btn-refresh').addEventListener('click', loadOrders);

    // ── SSE: actualizaciones en tiempo real ─────────────────────
    function connectSSE() {
      const token = sessionStorage.getItem('isumos_token');
      if (!token) return;

      const indicator = document.getElementById('sse-indicator');
      const es = new EventSource(`/api/events?token=${encodeURIComponent(token)}`);

      es.onopen = () => { indicator.style.background = 'var(--success)'; };

      es.onmessage = (e) => {
        const event = JSON.parse(e.data);
        if (event.tipo === 'nuevo_pedido') {
          loadOrders();
          showToast(`Nuevo pedido de ${event.sucursal_nombre}`);
        }
        if (event.tipo === 'estado_actualizado') {
          // Actualizar solo la orden afectada en memoria y re-renderizar
          const order = allOrders.find(o => o.id === event.order_id);
          if (order) { order.estado = event.estado; renderStats(allOrders); }
          else loadOrders();
        }
      };

      es.onerror = () => {
        indicator.style.background = 'var(--danger)';
        es.close();
        setTimeout(connectSSE, 5000);
      };
    }

    function showToast(msg) {
      const t = document.createElement('div');
      t.style.cssText = `
        position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
        background:var(--text-primary);color:#fff;padding:10px 20px;
        border-radius:999px;font-size:14px;z-index:9999;
        box-shadow:0 4px 12px rgba(0,0,0,.2);animation:fadein .2s ease;
      `;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 4000);
    }

    // ── Arrancar ────────────────────────────────────────────────
    loadOrders();
    connectSSE();
  </script>

</body>
</html>

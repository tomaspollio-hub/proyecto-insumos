<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Depósito — Farmacias Global</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: var(--font-sans); background: var(--bg); color: var(--text-primary); margin: 0; min-height: 100dvh; }

    /* ── Header ── */
    .header {
      position: sticky; top: 0; z-index: 100;
      height: var(--header-height);
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 var(--space-6); gap: var(--space-4);
    }
    .header__logo { height: 42px; }
    .header__title { font-size: var(--text-base); font-weight: var(--font-semibold); color: var(--text-secondary); }
    .header__sep { flex: 1; }
    .header__user { font-size: var(--text-sm); color: var(--text-muted); display: flex; align-items: center; gap: var(--space-2); }
    .btn-logout { font-size: var(--text-sm); font-weight: var(--font-medium); color: var(--text-secondary); background: none; border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-2) var(--space-3); cursor: pointer; transition: background var(--transition); }
    .btn-logout:hover { background: var(--bg-subtle); }

    /* ── Main ── */
    .main { max-width: 1100px; margin: 0 auto; padding: var(--space-8) var(--space-6); }

    /* ── Stats ── */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: var(--space-4); margin-bottom: var(--space-8); }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-5); }
    .stat-card__label { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-1); }
    .stat-card__value { font-size: var(--text-2xl); font-weight: var(--font-bold); }
    .stat--aprobado  .stat-card__value { color: var(--warning); }
    .stat--prep      .stat-card__value { color: var(--accent); }
    .stat--despachado .stat-card__value { color: var(--info, #3b82f6); }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: var(--space-6); }
    .tab { font-size: var(--text-sm); font-weight: 500; padding: var(--space-3) var(--space-5); border: none; border-bottom: 2px solid transparent; background: none; color: var(--text-muted); cursor: pointer; transition: all var(--transition); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab:hover { color: var(--text-primary); }
    .tab__count { display: inline-block; background: var(--bg-subtle); border-radius: 9999px; padding: 0 6px; font-size: 11px; margin-left: 5px; }
    .tab.active .tab__count { background: var(--accent); color: #fff; }

    /* ── Cards ── */
    .cards-list { display: flex; flex-direction: column; gap: var(--space-4); }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: var(--space-5);
      display: grid; grid-template-columns: 1fr auto; gap: var(--space-4);
    }
    .card__body {}
    .card__header { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3); flex-wrap: wrap; }
    .card__id { font-size: var(--text-xs); color: var(--text-muted); font-family: monospace; }
    .card__empresa { font-size: var(--text-base); font-weight: var(--font-semibold); }
    .card__cliente { font-size: var(--text-sm); color: var(--text-secondary); }
    .card__fecha { font-size: var(--text-xs); color: var(--text-muted); margin-left: auto; }
    .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 9999px; }
    .badge--aprobado    { background: #fef3c7; color: #92400e; }
    .badge--preparacion { background: #dbeafe; color: #1e40af; }
    .badge--despachado  { background: #d1fae5; color: #065f46; }
    .badge--entregado   { background: #f3f4f6; color: #6b7280; }

    /* ── Items table ── */
    .items { width: 100%; border-collapse: collapse; margin-top: var(--space-3); font-size: var(--text-sm); }
    .items th { text-align: left; font-weight: 600; color: var(--text-muted); padding: var(--space-1) var(--space-2); border-bottom: 1px solid var(--border); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .05em; }
    .items td { padding: var(--space-2); border-bottom: 1px solid var(--border-subtle, var(--border)); }
    .items tr:last-child td { border-bottom: none; }
    .items .qty { font-weight: 600; text-align: right; }

    /* ── Acciones ── */
    .card__actions { display: flex; flex-direction: column; gap: var(--space-2); align-items: flex-end; justify-content: flex-start; min-width: 160px; }
    .btn-action { width: 100%; font-size: var(--text-sm); font-weight: 600; padding: var(--space-2) var(--space-4); border: none; border-radius: var(--radius); cursor: pointer; transition: opacity var(--transition); }
    .btn-action:hover { opacity: .85; }
    .btn-action:disabled { opacity: .45; cursor: default; }
    .btn--preparar  { background: var(--accent); color: #fff; }
    .btn--despachar { background: #3b82f6; color: #fff; }
    .btn--entregar  { background: var(--success); color: #fff; }

    /* ── Empty ── */
    .empty { text-align: center; padding: var(--space-16) var(--space-6); color: var(--text-muted); }
    .empty__icon { font-size: 2.5rem; margin-bottom: var(--space-3); }
    .empty__text { font-size: var(--text-base); }

    /* ── Remito ── */
    .remito-row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); }
    .remito-input { flex: 1; padding: var(--space-1) var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: var(--text-sm); font-family: inherit; }
    .remito-input:focus { outline: none; border-color: var(--accent); }
    .obs-input { width: 100%; padding: var(--space-1) var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: var(--text-sm); font-family: inherit; margin-bottom: var(--space-2); resize: vertical; min-height: 48px; }
    .obs-input:focus { outline: none; border-color: var(--accent); }

    /* ── Toast ── */
    .toast { position: fixed; bottom: var(--space-6); right: var(--space-6); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3) var(--space-5); font-size: var(--text-sm); font-weight: 500; box-shadow: 0 4px 12px rgba(0,0,0,.15); z-index: 999; transform: translateY(120%); transition: transform .3s ease; }
    .toast.show { transform: translateY(0); }

    @media (max-width: 640px) {
      .card { grid-template-columns: 1fr; }
      .card__actions { flex-direction: row; flex-wrap: wrap; min-width: unset; }
      .btn-action { width: auto; }
    }
  </style>
</head>
<body>

<header class="header">
  <a id="logo-link" href="#" style="line-height:0"><img class="header__logo" src="assets/img/logo-global.png" alt="Farmacias Global" /></a>
  <span class="header__title">Depósito</span>
  <span class="header__sep"></span>
  <div class="header__user">
    <span id="header-user"></span>
    <button class="btn-logout" id="btn-logout">Cerrar sesión</button>
  </div>
</header>

<main class="main">
  <div class="stats">
    <div class="stat-card stat--aprobado">
      <div class="stat-card__label">Pendientes de preparar</div>
      <div class="stat-card__value" id="cnt-aprobado">—</div>
    </div>
    <div class="stat-card stat--prep">
      <div class="stat-card__label">En preparación</div>
      <div class="stat-card__value" id="cnt-prep">—</div>
    </div>
    <div class="stat-card stat--despachado">
      <div class="stat-card__label">Despachados</div>
      <div class="stat-card__value" id="cnt-despachado">—</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="pendiente">
      Por preparar <span class="tab__count" id="tab-cnt-pendiente">0</span>
    </button>
    <button class="tab" data-tab="preparacion">
      En preparación <span class="tab__count" id="tab-cnt-preparacion">0</span>
    </button>
    <button class="tab" data-tab="despachado">
      Despachados <span class="tab__count" id="tab-cnt-despachado">0</span>
    </button>
    <button class="tab" data-tab="entregado">
      Entregados <span class="tab__count" id="tab-cnt-entregado">0</span>
    </button>
  </div>

  <div class="cards-list" id="cards-list"></div>
</main>

<div class="toast" id="toast"></div>

<a href="https://wa.me/5492994566662" target="_blank" rel="noopener" title="WhatsApp" class="wa-fab">
  <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
</a>
<style>.wa-fab{position:fixed;bottom:24px;right:24px;z-index:9990;width:52px;height:52px;background:#25d366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .2s}.wa-fab:hover{transform:scale(1.1)}</style>

<script type="module">
import auth from './js/auth.js';

const ESTADOS_TAB = {
  pendiente:   'aprobado',
  preparacion: 'en_preparacion',
  despachado:  'despachado',
  entregado:   'entregado',
};

let presupuestos = [];
let currentTab   = 'pendiente';

// ── Auth ──────────────────────────────────────────────────────────────────────
const session = await auth.getSession();
if (!session || (session.rol !== 'deposito' && session.rol !== 'gerente')) {
  window.location.replace('./login.html'); throw new Error();
}
const token = sessionStorage.getItem('isumos_token');
document.getElementById('header-user').textContent = session.usuario;
document.getElementById('btn-logout').addEventListener('click', () => auth.logout());
document.getElementById('logo-link').href = session.rol === 'gerente' ? './gerente.html' : './deposito.html';

// ── Carga ─────────────────────────────────────────────────────────────────────
async function cargar() {
  try {
    const r = await fetch('/api/presupuestos', { headers: { Authorization: `Bearer ${token}` } });
    presupuestos = await r.json();
    render();
  } catch {
    document.getElementById('cards-list').innerHTML =
      '<div class="empty"><div class="empty__text">Error al cargar datos.</div></div>';
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const cnt = { aprobado:0, en_preparacion:0, despachado:0, entregado:0 };
  presupuestos.forEach(p => { if (cnt[p.estado] !== undefined) cnt[p.estado]++; });

  document.getElementById('cnt-aprobado').textContent   = cnt.aprobado;
  document.getElementById('cnt-prep').textContent       = cnt.en_preparacion;
  document.getElementById('cnt-despachado').textContent = cnt.despachado;

  document.getElementById('tab-cnt-pendiente').textContent   = cnt.aprobado;
  document.getElementById('tab-cnt-preparacion').textContent = cnt.en_preparacion;
  document.getElementById('tab-cnt-despachado').textContent  = cnt.despachado;
  document.getElementById('tab-cnt-entregado').textContent   = cnt.entregado;

  const estado    = ESTADOS_TAB[currentTab];
  const filtrados = presupuestos
    .filter(p => p.estado === estado)
    .sort((a, b) => new Date(a.fecha_solicitud) - new Date(b.fecha_solicitud));

  const list = document.getElementById('cards-list');
  if (!filtrados.length) {
    list.innerHTML = `<div class="empty"><div class="empty__icon">📦</div><div class="empty__text">No hay pedidos en esta etapa.</div></div>`;
    return;
  }
  list.innerHTML = filtrados.map(cardHTML).join('');
  list.querySelectorAll('[data-action]').forEach(btn =>
    btn.addEventListener('click', () => accion(btn.dataset.pid, btn.dataset.action, btn))
  );
}

// ── Card ──────────────────────────────────────────────────────────────────────
function cardHTML(p) {
  const fecha    = new Date(p.fecha_aprobacion || p.fecha_solicitud).toLocaleDateString('es-AR');
  const items    = (typeof p.items === 'string' ? JSON.parse(p.items) : p.items) || [];
  const badgeMap = {
    aprobado:       ['badge--aprobado',    'Aprobado'],
    en_preparacion: ['badge--preparacion', 'En preparación'],
    despachado:     ['badge--despachado',  'Despachado'],
    entregado:      ['badge--entregado',   'Entregado'],
  };
  const [cls, txt] = badgeMap[p.estado] || ['', p.estado];

  const rows = items.map(i =>
    `<tr><td>${i.nombre||i.sku_interno||''}</td><td>${i.presentacion||''}</td><td class="qty">${i.qty??i.cantidad??''} ${i.unidad_pedido||''}</td></tr>`
  ).join('');

  let accionBtn = '';
  if (p.estado === 'aprobado')
    accionBtn = `<button class="btn-action btn--preparar" data-pid="${p.id}" data-action="preparar">Comenzar preparación</button>`;
  if (p.estado === 'en_preparacion')
    accionBtn = `<div class="remito-row"><input class="remito-input" placeholder="N° remito (opcional)" id="remito-${p.id}"></div>
                 <textarea class="obs-input" id="obs-${p.id}" placeholder="Observaciones (ej: faltó ítem X)"></textarea>
                 <button class="btn-action btn--despachar" data-pid="${p.id}" data-action="despachar">Marcar despachado</button>`;
  if (p.estado === 'despachado')
    accionBtn = `<button class="btn-action btn--entregar" data-pid="${p.id}" data-action="entregar">Confirmar entrega</button>`;

  const remitoInfo = p.remito ? `<div class="card__cliente">Remito: <strong>${p.remito}</strong></div>` : '';
  const obsInfo    = p.observaciones ? `<div class="card__cliente" style="color:var(--warning)">Obs: ${p.observaciones}</div>` : '';

  return `<div class="card" id="card-${p.id}">
    <div class="card__body">
      <div class="card__header">
        <span class="card__empresa">${p.empresa_nombre||'—'}</span>
        <span class="badge ${cls}">${txt}</span>
        <span class="card__id">#${p.id.slice(0,8).toUpperCase()}</span>
        <span class="card__fecha">${fecha}</span>
      </div>
      ${p.usuario_cliente?`<div class="card__cliente">Contacto: ${p.usuario_cliente}</div>`:''}
      ${p.condiciones?`<div class="card__cliente" style="margin-top:4px">Condiciones: ${p.condiciones}</div>`:''}
      ${remitoInfo}${obsInfo}
      <table class="items"><thead><tr><th>Producto</th><th>Presentación</th><th style="text-align:right">Cantidad</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    <div class="card__actions">${accionBtn}</div>
  </div>`;
}

// ── Acciones ──────────────────────────────────────────────────────────────────
const ACCION_ESTADO = { preparar:'en_preparacion', despachar:'despachado', entregar:'entregado' };

async function accion(pid, action, btn) {
  const estado = ACCION_ESTADO[action];
  btn.disabled = true;
  const body = { estado };
  if (action === 'despachar') {
    const remito = document.getElementById(`remito-${pid}`)?.value.trim();
    const obs    = document.getElementById(`obs-${pid}`)?.value.trim();
    if (remito) body.remito = remito;
    if (obs)    body.observaciones = obs;
  }
  try {
    const r = await fetch(`/api/presupuestos/${pid}/estado`, {
      method: 'PATCH',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error();
    const p = presupuestos.find(x => x.id === pid);
    if (p) { p.estado = estado; if (body.remito) p.remito = body.remito; if (body.observaciones) p.observaciones = body.observaciones; }
    render();
    toast('Estado actualizado');
  } catch {
    btn.disabled = false;
    toast('Error al actualizar — intentá de nuevo');
  }
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentTab = t.dataset.tab;
    render();
  });
});

// ── SSE ───────────────────────────────────────────────────────────────────────
function connectSSE() {
  const es = new EventSource(`/api/events?token=${encodeURIComponent(token)}`);
  es.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (['presupuesto_aprobado','presupuesto_actualizado','nuevo_presupuesto'].includes(ev.tipo)) cargar();
  };
  es.onerror = () => { es.close(); setTimeout(connectSSE, 5000); };
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}

await cargar();
connectSSE();
</script>
</body>
</html>

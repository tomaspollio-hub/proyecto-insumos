<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo — Isumos Farmacias</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────── -->
  <header class="app-header">
    <div class="app-header__inner">
      <div class="app-header__brand">
        <img class="app-header__logo" src="assets/img/logo-global.png" alt="Farmacias Global">
      </div>

      <div class="app-header__meta">
        <span id="header-sucursal" class="header-sucursal"></span>
        <button id="btn-history" class="btn-history" type="button" aria-label="Historial de pedidos">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke-width="2" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
          </svg>
          <span>Historial</span>
        </button>
        <button id="btn-logout" class="btn-logout" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke-width="2" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
          </svg>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ── App Body ─────────────────────────────────────────────── -->
  <div class="app-body">

    <!-- ── Catálogo ─────────────────────────────────────────── -->
    <main class="app-main">

      <!-- Buscador -->
      <div class="search-bar">
        <label for="search-input" class="sr-only">Buscar producto</label>
        <div class="search-bar__wrap">
          <svg class="search-bar__icon" xmlns="http://www.w3.org/2000/svg" fill="none"
               viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
          </svg>
          <input
            id="search-input"
            class="search-bar__input"
            type="search"
            placeholder="Buscar por nombre o código de barras…"
            autocomplete="off"
            spellcheck="false"
            autofocus
          />
        </div>
      </div>

      <!-- Chips de categoría + botón repetir último pedido -->
      <div class="chips-bar" role="group" aria-label="Filtrar por categoría">
        <div id="category-chips" style="display:contents"></div>
        <button id="btn-repeat-last" class="btn-repeat-last" type="button" hidden>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke-width="2" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
          </svg>
          Repetir último pedido
        </button>
      </div>

      <!-- Contador de resultados -->
      <p id="results-count" class="results-count" aria-live="polite" aria-atomic="true"></p>

      <!-- Grid de productos -->
      <div id="product-grid" class="product-grid" role="list"></div>

    </main>

    <!-- ── Carrito ───────────────────────────────────────────── -->
    <aside id="cart-panel" class="cart-panel" aria-label="Carrito de compras">

      <!-- Tab visible en mobile cuando el panel está cerrado -->
      <div id="cart-tab" class="cart-panel__tab" role="button" tabindex="0"
           aria-expanded="false" aria-controls="cart-inner">
        <div class="cart-tab__left">
          <svg class="cart-tab__icon" xmlns="http://www.w3.org/2000/svg" fill="none"
               viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.962-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
          </svg>
          <span class="cart-tab__label">Carrito</span>
          <span id="cart-badge" class="cart-badge" hidden>0</span>
        </div>
        <svg class="cart-tab__chevron" xmlns="http://www.w3.org/2000/svg" fill="none"
             viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 15.75 7.5-7.5 7.5 7.5" />
        </svg>
      </div>

      <!-- Contenido del panel -->
      <div id="cart-inner" class="cart-panel__inner">

        <div class="cart-panel__header">
          <h2 class="cart-panel__title">Carrito</h2>
          <button id="cart-close" class="cart-panel__close" aria-label="Cerrar carrito">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                 stroke-width="2" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div id="cart-items" role="list"></div>

        <div id="cart-footer" class="cart-panel__footer" hidden>
          <p id="cart-summary"></p>
          <button id="btn-clear-cart" class="btn-clear-cart" type="button">Vaciar carrito</button>
          <button id="btn-review-order" class="btn-review-order" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                 stroke-width="2" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" />
            </svg>
            Revisar pedido
          </button>
        </div>

      </div>
    </aside>

  </div><!-- /.app-body -->

  <!-- ── Producto: modal overlay ──────────────────────────────── -->
  <div id="modal-overlay" class="modal-overlay" hidden aria-modal="true" role="dialog">
    <div id="modal-content" class="modal"></div>
  </div>

  <!-- ── Confirmar pedido: overlay ────────────────────────────── -->
  <div id="confirm-overlay" class="modal-overlay" hidden aria-modal="true" role="dialog" aria-label="Confirmar pedido">
    <div id="confirm-modal" class="modal modal--wide"></div>
  </div>

  <!-- ── Historial: overlay ───────────────────────────────────── -->
  <div id="history-overlay" class="modal-overlay" hidden aria-modal="true" role="dialog" aria-label="Historial de pedidos">
    <div id="history-modal" class="modal modal--wide"></div>
  </div>

  <!-- ── Toasts ───────────────────────────────────────────────── -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <script type="module">
    import auth        from './js/auth.js';
    import storage     from './js/storage.js';
    import catalog     from './js/catalog.js';
    import cart        from './js/cart.js';
    import cartView    from './js/views/cart-view.js';
    import orderView   from './js/views/order-view.js';
    import catalogView from './js/views/catalog-view.js';

    /* ── Auth ─────────────────────────────────────────────────── */
    const session = await auth.requireAuth();
    if (!session) throw new Error('Sin sesión');

    document.getElementById('header-sucursal').textContent = session.sucursal;
    document.getElementById('btn-logout').addEventListener('click', () => auth.logout());

    /* ── Cart ─────────────────────────────────────────────────── */
    await cart.init(session);

    function refreshCart() {
      cartView.render(cart.getItems(), cart.getSummary());
    }

    cartView.init({
      onRemove:    async (sku)        => { await cart.remove(sku);           refreshCart(); },
      onUpdateQty: async (sku, delta) => { await cart.updateQty(sku, delta); refreshCart(); },
      onClear:     async ()           => { await cart.clear();               refreshCart(); },
      onReview: () => {
        const items = cart.getItems();
        if (!items.length) return;
        orderView.renderConfirm(items, cart.getSummary(), async () => {
          const result = await cart.submitOrder();
          orderView.closeConfirm();
          refreshCart();
          if (result.ok) orderView.renderSuccess(result.order);
        });
      },
    });

    refreshCart();

    /* ── Catalog ──────────────────────────────────────────────── */
    const searchInput = document.getElementById('search-input');
    searchInput.addEventListener('input',   e => catalog.onSearch(e.target.value));
    searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') catalog.onEnter(e.target.value); });

    catalog.setCartAdd(async (sku, qty) => {
      const result = await cart.add(sku, qty);
      refreshCart();
      return result;
    });

    await catalog.init();

    /* ── Repetir último pedido ────────────────────────────────── */
    const btnRepeatLast = document.getElementById('btn-repeat-last');
    const savedOrders   = await storage.getOrders(session.id);
    if (savedOrders.length > 0) btnRepeatLast.hidden = false;

    btnRepeatLast.addEventListener('click', async () => {
      const result = await cart.repeatOrder(null);
      refreshCart();
      const n = result.cargados.length;
      let msg = `${n} producto${n !== 1 ? 's' : ''} del último pedido cargado${n !== 1 ? 's' : ''} al carrito`;
      if (result.omitidos.length) {
        msg += ` · Sin stock: ${result.omitidos.map(o => o.nombre).join(', ')}`;
      }
      catalogView.showToast(msg);
    });

    /* ── Badge de aprobación (encargado) ──────────────────────── */
    const btnHistory = document.getElementById('btn-history');
    let pendingApproval = [];

    async function refreshApprovalBadge() {
      if (session.rol !== 'encargado') return;
      try {
        pendingApproval = await storage.getPendingApproval(session.id);
      } catch { pendingApproval = []; }

      let badge = btnHistory.querySelector('.approval-badge');
      if (pendingApproval.length > 0) {
        if (!badge) {
          badge = document.createElement('span');
          badge.className = 'approval-badge';
          btnHistory.appendChild(badge);
        }
        badge.textContent = pendingApproval.length;
      } else {
        badge?.remove();
      }
    }

    await refreshApprovalBadge();

    /* ── Historial ────────────────────────────────────────────── */
    btnHistory.addEventListener('click', async () => {
      const orders = await storage.getOrders(session.id);
      orderView.renderHistory(orders, {
        onRepeat: async (orderId) => {
          const result = await cart.repeatOrder(orderId);
          orderView.closeHistory();
          refreshCart();
          const n = result.cargados.length;
          let msg = `${n} producto${n !== 1 ? 's' : ''} cargado${n !== 1 ? 's' : ''} al carrito`;
          if (result.omitidos.length) {
            msg += ` · Omitidos (sin stock): ${result.omitidos.map(o => o.nombre).join(', ')}`;
          }
          catalogView.showToast(msg);
        },
        onApprove: session.rol === 'encargado' ? async (orderId) => {
          await storage.approveOrder(orderId);
          pendingApproval = pendingApproval.filter(o => o.id !== orderId);
          const orders2 = await storage.getOrders(session.id);
          orderView.renderHistory(orders2, arguments.callee.__callbacks);
          refreshApprovalBadge();
          catalogView.showToast('Pedido aprobado — pasó al depósito');
        } : undefined,
        onReject: session.rol === 'encargado' ? async (orderId) => {
          await storage.rejectOrder(orderId);
          pendingApproval = pendingApproval.filter(o => o.id !== orderId);
          const orders2 = await storage.getOrders(session.id);
          orderView.renderHistory(orders2, arguments.callee.__callbacks);
          refreshApprovalBadge();
          catalogView.showToast('Pedido rechazado');
        } : undefined,
        pendingApproval: session.rol === 'encargado' ? pendingApproval : [],
      });
    });

    /* ── SSE: actualizaciones en tiempo real ──────────────────── */
    const ESTADO_LABELS = {
      pendiente_aprobacion: 'Esperando aprobación',
      pendiente:   'Pendiente en depósito',
      preparando:  'En preparación',
      despachado:  'Despachado',
      recibido:    'Recibido',
      rechazado:   'Rechazado',
    };

    function connectSSE() {
      const token = sessionStorage.getItem('isumos_token');
      if (!token) return;

      const es = new EventSource(`/api/events?token=${encodeURIComponent(token)}`);

      es.onmessage = (e) => {
        const event = JSON.parse(e.data);

        if (event.tipo === 'pedido_para_aprobar' && session.rol === 'encargado') {
          refreshApprovalBadge();
          catalogView.showToast(`Nuevo pedido de ${event.usuario} — esperando aprobación`);
        }

        if (event.tipo === 'estado_actualizado') {
          const label = ESTADO_LABELS[event.estado] ?? event.estado;
          catalogView.showToast(`Pedido actualizado: ${label}`);
        }
      };

      es.onerror = () => {
        es.close();
        setTimeout(connectSSE, 5000);
      };
    }

    connectSSE();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar — Isumos Farmacias</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="login-page">

  <div class="login-card">

    <!-- Branding -->
    <div class="login-brand">
      <div class="login-brand__logo" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 3v2m0 14v2M5.636 5.636l1.414 1.414m9.9 9.9 1.414 1.414M3 12h2m14 0h2M5.636 18.364l1.414-1.414M16.95 7.05l1.414-1.414M9 12a3 3 0 1 1 6 0 3 3 0 0 1-6 0Z" />
        </svg>
      </div>
      <h1 class="login-brand__title">Isumos</h1>
      <p class="login-brand__subtitle">Sistema de pedidos internos</p>
    </div>

    <!-- Error -->
    <div id="login-error" class="login-error" hidden role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd"
          d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-1.5 0v-4.5A.75.75 0 0 1 10 5Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
          clip-rule="evenodd" />
      </svg>
      <span id="login-error-text">Usuario o contraseña incorrectos.</span>
    </div>

    <!-- Formulario -->
    <form id="login-form" class="login-form" novalidate>

      <div class="form-field">
        <label class="form-field__label" for="input-usuario">Sucursal / Usuario</label>
        <input
          class="form-field__input"
          id="input-usuario"
          name="usuario"
          type="text"
          placeholder="ej: centro"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          required
        />
      </div>

      <div class="form-field">
        <label class="form-field__label" for="input-password">Contraseña</label>
        <input
          class="form-field__input"
          id="input-password"
          name="password"
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="btn-login" id="btn-submit">
        <span class="btn-login__text">Ingresar</span>
        <span class="btn-login__spinner" aria-hidden="true"></span>
      </button>

    </form>

    <p class="login-footer">Isumos &copy; 2026 — Uso interno</p>
  </div>

  <script type="module">
    import auth from './js/auth.js';

    const form    = document.getElementById('login-form');
    const btnSubmit = document.getElementById('btn-submit');
    const errorBox  = document.getElementById('login-error');
    const errorText = document.getElementById('login-error-text');
    const inputUsuario  = document.getElementById('input-usuario');
    const inputPassword = document.getElementById('input-password');

    /* Redirigir si ya hay sesión activa */
    auth.getSession().then(session => {
      if (session) window.location.href = './index.html';
    });

    function setLoading(on) {
      btnSubmit.classList.toggle('is-loading', on);
      btnSubmit.disabled = on;
      inputUsuario.disabled  = on;
      inputPassword.disabled = on;
    }

    function showError(msg) {
      errorText.textContent = msg;
      errorBox.hidden = false;
      inputUsuario.classList.add('is-error');
      inputPassword.classList.add('is-error');
      inputUsuario.focus();
    }

    function clearError() {
      errorBox.hidden = true;
      inputUsuario.classList.remove('is-error');
      inputPassword.classList.remove('is-error');
    }

    /* Limpiar error al escribir */
    [inputUsuario, inputPassword].forEach(el =>
      el.addEventListener('input', clearError)
    );

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const usuario  = inputUsuario.value.trim();
      const password = inputPassword.value;

      if (!usuario || !password) {
        showError('Completá usuario y contraseña.');
        return;
      }

      setLoading(true);

      const result = await auth.login(usuario, password);

      if (result.ok) {
        window.location.href = './index.html';
      } else {
        setLoading(false);
        const mensajes = {
          credenciales_invalidas: 'Usuario o contraseña incorrectos.',
          error_servidor: 'No se pudo conectar. Intentá de nuevo.',
        };
        showError(mensajes[result.motivo] ?? 'Error inesperado.');
      }
    });
  </script>

</body>
</html>

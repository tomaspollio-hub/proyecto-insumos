<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ventas — Isumos</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: var(--font-sans); background: var(--bg); color: var(--text-primary); margin: 0; }

    .header {
      position: sticky; top: 0; z-index: 100; height: var(--header-height);
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 var(--space-6); gap: var(--space-4);
    }
    .header__brand { font-size: var(--text-lg); font-weight: var(--font-bold); color: var(--accent); }
    .header__title { font-size: var(--text-base); font-weight: var(--font-semibold); color: var(--text-secondary); }
    .header__sep { flex: 1; }
    .btn-nav { font-size: var(--text-sm); padding: var(--space-2) var(--space-3); border: 1px solid var(--border); border-radius: var(--radius); background: none; color: var(--text-secondary); text-decoration: none; cursor: pointer; transition: background var(--transition); }
    .btn-nav:hover { background: var(--bg-subtle); }
    .sse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); display: inline-block; }

    .main { max-width: 1100px; margin: 0 auto; padding: var(--space-6); }

    /* ── Stats ── */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--space-4); margin-bottom: var(--space-8); }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-5); cursor: pointer; transition: box-shadow var(--transition); }
    .stat-card:hover { box-shadow: var(--shadow-md); }
    .stat-card.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light); }
    .stat-card__label { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-1); }
    .stat-card__val   { font-size: var(--text-2xl); font-weight: var(--font-bold); }
    .stat-card--sol  .stat-card__val { color: var(--text-secondary); }
    .stat-card--rev  .stat-card__val { color: var(--info); }
    .stat-card--pre  .stat-card__val { color: var(--warning); }
    .stat-card--apr  .stat-card__val { color: var(--success); }

    /* ── Toolbar ── */
    .toolbar { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; margin-bottom: var(--space-4); }
    .filter-btn { font-size: var(--text-sm); font-weight: 500; padding: var(--space-2) var(--space-4); border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); cursor: pointer; transition: all var(--transition); }
    .filter-btn:hover  { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .toolbar__sep { flex: 1; }
    .search-input { padding: var(--space-2) var(--space-3); border: 1px solid var(--border); border-radius: var(--radius); font-size: var(--text-sm); font-family: inherit; background: var(--surface); width: 220px; }
    .search-input:focus { outline: none; border-color: var(--accent); }

    /* ── List ── */
    .presup-list { display: flex; flex-direction: column; gap: var(--space-3); }
    .presup-row {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
      display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4) var(--space-5);
      cursor: pointer; transition: box-shadow var(--transition); flex-wrap: wrap;
    }
    .presup-row:hover { box-shadow: var(--shadow-md); }
    .presup-row--new { border-left: 3px solid var(--accent); }
    .presup-row__empresa { font-weight: var(--font-semibold); font-size: var(--text-base); flex: 1; min-width: 140px; }
    .presup-row__meta    { font-size: var(--text-xs); color: var(--text-muted); }
    .presup-row__items   { font-size: var(--text-sm); color: var(--text-secondary); }

    /* ── Estado badges ── */
    .estado-badge { display: inline-flex; align-items: center; font-size: var(--text-xs); font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
    .estado-badge--solicitado    { background: var(--bg-subtle);    color: var(--text-secondary); }
    .estado-badge--en_revision   { background: var(--info-light);   color: var(--info); }
    .estado-badge--presupuestado { background: var(--warning-light);color: var(--warning); }
    .estado-badge--aprobado      { background: var(--success-light);color: var(--success); }
    .estado-badge--rechazado     { background: var(--danger-light); color: var(--danger); }
    .estado-badge--en_preparacion{ background: var(--accent-light); color: var(--accent); }
    .estado-badge--despachado    { background: var(--info-light);   color: var(--info); }
    .estado-badge--entregado     { background: var(--success-light);color: var(--success); }

    /* ── Detail panel ── */
    .detail-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-6); margin-top: var(--space-6); }
    .detail-header { display: flex; align-items: flex-start; gap: var(--space-4); margin-bottom: var(--space-5); flex-wrap: wrap; }
    .detail-header__left { flex: 1; }
    .detail-empresa { font-size: var(--text-xl); font-weight: var(--font-bold); }
    .detail-meta    { font-size: var(--text-sm); color: var(--text-muted); margin-top: var(--space-1); }
    .btn-close-detail { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: var(--space-1); }
    .btn-close-detail svg { width: 20px; height: 20px; }

    /* ── Items editor ── */
    .items-editor { width: 100%; border-collapse: collapse; margin-bottom: var(--space-5); }
    .items-editor th { text-align: left; font-size: var(--text-xs); font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; padding: var(--space-2) var(--space-3); border-bottom: 2px solid var(--border); }
    .items-editor td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--bg-subtle); font-size: var(--text-sm); vertical-align: middle; }
    .price-input, .time-input {
      padding: var(--space-1) var(--space-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-size: var(--text-sm); font-family: inherit;
      width: 100%;
    }
    .price-input { text-align: right; }
    .price-input:focus, .time-input:focus { outline: none; border-color: var(--accent); }
    .subtotal-cell { font-weight: 600; text-align: right; }
    .total-row td  { font-weight: 700; font-size: var(--text-base); border-top: 2px solid var(--border); }

    /* ── Form fields ── */
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-bottom: var(--space-4); }
    .form-field label { display: block; font-size: var(--text-xs); font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: var(--space-1); }
    .form-field input, .form-field textarea, .form-field select {
      width: 100%; padding: var(--space-2) var(--space-3); border: 1px solid var(--border);
      border-radius: var(--radius); font-size: var(--text-sm); font-family: inherit; background: var(--surface);
    }
    .form-field textarea { resize: vertical; min-height: 60px; }
    .form-field input:focus, .form-field textarea:focus, .form-field select:focus { outline: none; border-color: var(--accent); }

    /* ── Actions ── */
    .detail-actions { display: flex; gap: var(--space-3); flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: var(--space-5); margin-top: var(--space-5); }
    .btn-primary { padding: var(--space-3) var(--space-6); background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-size: var(--text-sm); font-weight: 600; cursor: pointer; }
    .btn-primary:hover    { background: var(--accent-hover); }
    .btn-primary:disabled { background: var(--border); color: var(--text-muted); cursor: default; }
    .btn-secondary { padding: var(--space-3) var(--space-6); background: none; color: var(--text-secondary); border: 1px solid var(--border); border-radius: var(--radius); font-size: var(--text-sm); font-weight: 600; cursor: pointer; }
    .btn-secondary:hover { background: var(--bg-subtle); }
    .estado-select { padding: var(--space-2) var(--space-3); border: 1px solid var(--border); border-radius: var(--radius); font-size: var(--text-sm); font-family: inherit; cursor: pointer; }

    /* ── Notas del cliente ── */
    .client-notes { background: var(--accent-light); border-radius: var(--radius); padding: var(--space-3) var(--space-4); font-size: var(--text-sm); color: var(--accent); margin-bottom: var(--space-4); }
    .client-notes strong { display: block; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }

    /* ── IVA breakdown ── */
    .iva-breakdown { background: var(--bg-subtle); border-radius: var(--radius); padding: var(--space-3) var(--space-4); font-size: var(--text-sm); margin-bottom: var(--space-5); }
    .iva-row { display: flex; justify-content: space-between; padding: 2px 0; }
    .iva-row--total { font-weight: 700; font-size: var(--text-base); border-top: 1px solid var(--border); margin-top: var(--space-2); padding-top: var(--space-2); }

    /* ── Comentarios ── */
    .section-title { font-size: var(--text-sm); font-weight: 700; color: var(--text-secondary); margin-bottom: var(--space-3); display: flex; align-items: center; gap: var(--space-2); }
    .comments-thread { display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-3); max-height: 300px; overflow-y: auto; }
    .comment-bubble { padding: var(--space-2) var(--space-3); border-radius: var(--radius); max-width: 80%; font-size: var(--text-sm); line-height: 1.5; }
    .comment-bubble--ventas  { background: var(--accent-light); color: var(--accent); align-self: flex-end; }
    .comment-bubble--cliente { background: var(--bg-subtle); color: var(--text-primary); align-self: flex-start; }
    .comment-bubble--interno { background: var(--warning-light); color: var(--warning); align-self: flex-end; font-style: italic; }
    .comment-meta { font-size: 10px; opacity: .7; margin-top: 2px; }
    .comment-input-row { display: flex; gap: var(--space-2); align-items: flex-end; }
    .comment-input { flex: 1; padding: var(--space-2) var(--space-3); border: 1px solid var(--border); border-radius: var(--radius); font-size: var(--text-sm); font-family: inherit; resize: none; min-height: 38px; }
    .comment-input:focus { outline: none; border-color: var(--accent); }
    .btn-send-comment { padding: var(--space-2) var(--space-3); background: var(--accent); color: #fff; border: none; border-radius: var(--radius); cursor: pointer; font-size: var(--text-sm); white-space: nowrap; }
    .internal-check { font-size: var(--text-xs); color: var(--text-muted); display: flex; align-items: center; gap: 4px; cursor: pointer; }

    /* ── Adjuntos ── */
    .adjuntos-list { display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-3); }
    .adjunto-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-3); background: var(--bg-subtle); border-radius: var(--radius); font-size: var(--text-sm); }
    .adjunto-row__name { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .adjunto-row__meta { font-size: var(--text-xs); color: var(--text-muted); }
    .btn-download { font-size: var(--text-xs); font-weight: 600; padding: 3px 10px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border); color: var(--accent); cursor: pointer; text-decoration: none; }
    .upload-row { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
    .upload-row input[type=file] { font-size: var(--text-xs); flex: 1; }

    .empty-state { text-align: center; padding: var(--space-16); color: var(--text-muted); font-size: var(--text-sm); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }

    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--text-primary); color: #fff;
      padding: 10px 20px; border-radius: 999px;
      font-size: var(--text-sm); font-weight: var(--font-medium);
      z-index: 9999; opacity: 0; pointer-events: none;
      box-shadow: var(--shadow-lg);
      transition: opacity var(--transition-slow), transform var(--transition-slow);
    }
    #toast.toast--visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header class="header">
    <a id="logo-link" href="#" style="line-height:0"><img src="assets/img/logo-global.png" alt="Farmacias Global" style="height:42px"></a>
    <span class="header__title">/ Ventas</span>
    <div class="header__sep"></div>
    <span class="sse-dot" id="sse-dot" title="Tiempo real"></span>
    <a href="./empresas.html" class="btn-nav">Clientes</a>
    <button class="btn-nav" id="btn-logout">Salir</button>
  </header>

  <main class="main">

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card stat-card--sol" data-filter="solicitado">
        <div class="stat-card__label">Nuevos</div>
        <div class="stat-card__val" id="stat-sol">—</div>
      </div>
      <div class="stat-card stat-card--rev" data-filter="en_revision">
        <div class="stat-card__label">En revisión</div>
        <div class="stat-card__val" id="stat-rev">—</div>
      </div>
      <div class="stat-card stat-card--pre" data-filter="presupuestado">
        <div class="stat-card__label">Esperando respuesta</div>
        <div class="stat-card__val" id="stat-pre">—</div>
      </div>
      <div class="stat-card stat-card--apr" data-filter="aprobado">
        <div class="stat-card__label">Aprobados</div>
        <div class="stat-card__val" id="stat-apr">—</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button class="filter-btn active" data-estado="">Todos</button>
      <button class="filter-btn" data-estado="solicitado">Nuevos</button>
      <button class="filter-btn" data-estado="en_revision">En revisión</button>
      <button class="filter-btn" data-estado="presupuestado">Enviados</button>
      <button class="filter-btn" data-estado="aprobado">Aprobados</button>
      <button class="filter-btn" data-estado="en_preparacion">En preparación</button>
      <div class="toolbar__sep"></div>
      <input class="search-input" id="search" placeholder="Buscar empresa…" type="search" />
    </div>

    <!-- List -->
    <div class="presup-list" id="presup-list">
      <div class="empty-state"><span class="spinner"></span></div>
    </div>

    <!-- Detail (hidden until click) -->
    <div class="detail-panel" id="detail-panel" style="display:none"></div>

  </main>

  <div id="toast"></div>

  <!-- Confirm modal -->
  <div id="confirm-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;align-items:center;justify-content:center;padding:var(--space-4)">
    <div style="background:var(--surface);border-radius:var(--radius-lg);max-width:380px;width:100%;padding:var(--space-6)">
      <div id="confirm-msg" style="font-size:var(--text-base);font-weight:600;margin-bottom:var(--space-2)"></div>
      <div id="confirm-sub" style="font-size:var(--text-sm);color:var(--text-muted);margin-bottom:var(--space-5)"></div>
      <div style="display:flex;gap:var(--space-3);justify-content:flex-end">
        <button class="btn-secondary" id="confirm-cancel">Cancelar</button>
        <button class="btn-primary" id="confirm-ok">Confirmar</button>
      </div>
    </div>
  </div>

  <a href="https://wa.me/5492994566662" target="_blank" rel="noopener" title="WhatsApp" class="wa-fab">

  </a>
  <style>.wa-fab{position:fixed;bottom:24px;right:24px;z-index:9990;width:52px;height:52px;background:#25d366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .2s}.wa-fab:hover{transform:scale(1.1)}</style>

  <script type="module">
    import auth from './js/auth.js';

    const session = await auth.requireAuth();
    if (!session) throw new Error();
    if (session.rol !== 'ventas' && session.rol !== 'deposito' && session.rol !== 'gerente') {
      window.location.href = './login.html'; throw new Error();
    }
    document.getElementById('btn-logout').addEventListener('click', () => auth.logout());
    const _home = { gerente:'./gerente.html', ventas:'./ventas.html', deposito:'./deposito.html' };
    document.getElementById('logo-link').href = _home[session.rol] || './login.html';

    const token = sessionStorage.getItem('isumos_token');
    function authH() { return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }; }

    let allPresupuestos = [];
    let currentFilter   = '';
    let searchQuery     = '';
    let openId          = null;

    const ESTADO_LABELS = {
      solicitado: 'Nuevo', en_revision: 'En revisión',
      presupuestado: 'Enviado al cliente', aprobado: 'Aprobado',
      rechazado: 'Rechazado', en_preparacion: 'En preparación',
      despachado: 'Despachado', entregado: 'Entregado',
    };

    let empresasMap = {};

    // ── Cargar ────────────────────────────────────────────────
    async function load() {
      const [rP, rE] = await Promise.all([
        fetch('/api/presupuestos', { headers: authH() }),
        fetch('/api/empresas',     { headers: authH() }),
      ]);
      allPresupuestos = await rP.json();
      const empresasList = await rE.json();
      empresasMap = Object.fromEntries(empresasList.map(e => [e.id, e]));
      renderStats();
      renderList();
    }

    function renderStats() {
      const counts = { solicitado:0, en_revision:0, presupuestado:0, aprobado:0 };
      allPresupuestos.forEach(p => { if (p.estado in counts) counts[p.estado]++; });
      document.getElementById('stat-sol').textContent = counts.solicitado;
      document.getElementById('stat-rev').textContent = counts.en_revision;
      document.getElementById('stat-pre').textContent = counts.presupuestado;
      document.getElementById('stat-apr').textContent = counts.aprobado;
    }

    function filtered() {
      const q = searchQuery.toLowerCase();
      return allPresupuestos.filter(p =>
        (!currentFilter || p.estado === currentFilter) &&
        (!q || p.empresa_nombre.toLowerCase().includes(q) || p.usuario_cliente.toLowerCase().includes(q))
      );
    }

    function renderList() {
      const list = filtered();
      const el   = document.getElementById('presup-list');
      if (!list.length) {
        el.innerHTML = '<div class="empty-state">No hay presupuestos con este filtro.</div>';
        return;
      }
      el.innerHTML = list.map(p => `
        <div class="presup-row${p.estado==='solicitado'?' presup-row--new':''}" data-id="${p.id}">
          <div class="presup-row__empresa">${p.empresa_nombre}</div>
          <span class="estado-badge estado-badge--${p.estado}">${ESTADO_LABELS[p.estado]??p.estado}</span>
          <span class="presup-row__meta">${fmtDate(p.fecha_solicitud)} · ${p.usuario_cliente}</span>
          <span class="presup-row__items">${p.items.length} productos</span>
        </div>`).join('');
      el.querySelectorAll('.presup-row').forEach(row => {
        row.addEventListener('click', () => openDetail(row.dataset.id));
      });
    }

    // ── Filtros ───────────────────────────────────────────────
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.estado;
        renderList();
      });
    });
    document.querySelectorAll('.stat-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.filter-btn[data-estado="${card.dataset.filter}"]`)?.classList.add('active');
        currentFilter = card.dataset.filter;
        renderList();
      });
    });
    document.getElementById('search').addEventListener('input', e => {
      searchQuery = e.target.value;
      renderList();
    });

    // ── Detail ────────────────────────────────────────────────
    function openDetail(pid) {
      openId = pid;
      const p = allPresupuestos.find(x => x.id === pid);
      if (!p) return;
      const panel = document.getElementById('detail-panel');
      panel.style.display = '';
      panel.scrollIntoView({ behavior: 'smooth', block: 'start' });

      const canEdit   = ['solicitado','en_revision'].includes(p.estado);
      const canSend   = ['solicitado','en_revision'].includes(p.estado);
      const canChange = ['aprobado','en_preparacion','despachado'].includes(p.estado);

      const emp = empresasMap[p.empresa_id] || {};
      const empInfo = [
        emp.telefono ? `📞 ${emp.telefono}` : '',
        emp.email    ? `✉ ${emp.email}`    : '',
        emp.cuit     ? `CUIT: ${emp.cuit}` : '',
      ].filter(Boolean).join(' · ');

      panel.innerHTML = `
        <div class="detail-header">
          <div class="detail-header__left">
            <div class="detail-empresa">${p.empresa_nombre}</div>
            <div class="detail-meta">
              ${p.usuario_cliente} · ${fmtDate(p.fecha_solicitud)}
              · <span class="estado-badge estado-badge--${p.estado}">${ESTADO_LABELS[p.estado]??p.estado}</span>
            </div>
            ${empInfo ? `<div style="font-size:var(--text-xs);color:var(--text-muted);margin-top:4px">${empInfo}</div>` : ''}
          </div>
          <button class="btn-close-detail" id="btn-close-detail">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
          </button>
        </div>

        ${p.notas_cliente ? `<div class="client-notes"><strong>Observaciones del cliente</strong>${p.notas_cliente}</div>` : ''}
        ${p.motivo_rechazo ? `<div class="client-notes" style="background:var(--danger-light);color:var(--danger)"><strong>Motivo de rechazo</strong>${p.motivo_rechazo}</div>` : ''}

        <table class="items-editor" id="items-table">
          <thead><tr>
            <th style="width:28%">Producto</th>
            <th>Cant.</th>
            <th>Entrega</th>
            <th style="width:110px">Precio unit. $</th>
            <th style="width:70px">% Dto.</th>
            <th style="width:90px">Alíc. IVA</th>
            <th>Subtotal</th>
          </tr></thead>
          <tbody>
            ${p.items.map((i,idx) => `
              <tr data-idx="${idx}">
                <td>${i.nombre}<br><small style="color:var(--text-muted)">${i.presentacion||''}</small></td>
                <td>${i.qty} ${i.unidad_pedido||''}</td>
                <td><input class="time-input" type="text" data-field="tiempo_entrega" value="${i.tiempo_entrega||''}" placeholder="ej: 3-5 días" ${canEdit?'':'readonly'}></td>
                <td><input class="price-input" type="number" min="0" step="0.01" data-field="precio_unitario" value="${i.precio_unitario??''}" placeholder="0.00" ${canEdit?'':'readonly'}></td>
                <td><input class="price-input" type="number" min="0" max="100" step="0.1" data-field="descuento" value="${i.descuento??0}" ${canEdit?'':'readonly'}></td>
                <td>
                  <select class="price-input" data-field="alicuota_iva" style="text-align:left" ${canEdit?'':'disabled'}>
                    <option value="0"    ${(i.alicuota_iva??21)===0    ?'selected':''}>Exento</option>
                    <option value="10.5" ${(i.alicuota_iva??21)===10.5 ?'selected':''}>10.5%</option>
                    <option value="21"   ${(i.alicuota_iva??21)===21   ?'selected':''}>21%</option>
                    <option value="27"   ${(i.alicuota_iva??21)===27   ?'selected':''}>27%</option>
                  </select>
                </td>
                <td class="subtotal-cell" data-idx="${idx}">${i.subtotal!=null?'$'+fmt(i.subtotal):'—'}</td>
              </tr>`).join('')}
          </tbody>
          <tfoot id="iva-tfoot"></tfoot>
        </table>

        <div class="form-row">
          <div class="form-field">
            <label>Condiciones de venta</label>
            <textarea id="field-condiciones" rows="3" placeholder="Forma de pago, garantía, etc.">${p.condiciones||''}</textarea>
          </div>
          <div class="form-field">
            <label>Notas internas</label>
            <textarea id="field-notas-ventas" rows="3" placeholder="Solo visible para el equipo">${p.notas_ventas||''}</textarea>
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label>Validez (días)</label>
            <input type="number" id="field-validez" min="1" value="${p.validez_dias||15}" />
          </div>
        </div>

        <div class="detail-actions">
          ${canEdit ? `<button class="btn-secondary" id="btn-guardar">Guardar cambios</button>` : ''}
          ${canSend ? `<button class="btn-primary" id="btn-enviar">Enviar presupuesto al cliente</button>` : ''}
          ${canChange ? `
            <select class="estado-select" id="estado-select">
              <option value="">Cambiar estado…</option>
              <option value="en_preparacion" ${p.estado==='en_preparacion'?'selected':''}>En preparación</option>
              <option value="despachado"     ${p.estado==='despachado'?'selected':''}>Despachado</option>
              <option value="entregado"      ${p.estado==='entregado'?'selected':''}>Entregado</option>
            </select>` : ''}
        </div>

        <!-- Adjuntos -->
        <div style="border-top:1px solid var(--border);padding-top:var(--space-5);margin-top:var(--space-2)">
          <div class="section-title">Archivos adjuntos</div>
          <div class="adjuntos-list" id="adjuntos-list"><small style="color:var(--text-muted)">Cargando…</small></div>
          <div class="upload-row">
            <input type="file" id="adjunto-file" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg" />
            <button class="btn-secondary" id="btn-upload" style="padding:6px 16px">Subir archivo</button>
          </div>
        </div>

        <!-- Comentarios -->
        <div style="border-top:1px solid var(--border);padding-top:var(--space-5);margin-top:var(--space-5)">
          <div class="section-title">Comentarios</div>
          <div class="comments-thread" id="comments-thread"><small style="color:var(--text-muted)">Cargando…</small></div>
          <div class="comment-input-row">
            <textarea class="comment-input" id="comment-input" placeholder="Escribí un mensaje al cliente…" rows="2"></textarea>
            <div style="display:flex;flex-direction:column;gap:var(--space-2)">
              <button class="btn-send-comment" id="btn-send-comment">Enviar</button>
              <label class="internal-check"><input type="checkbox" id="chk-interno"> Solo interno</label>
            </div>
          </div>
        </div>`;

      // Recalcular subtotales en tiempo real
      updateTotals(p.items);
      panel.querySelectorAll('.price-input, [data-field="alicuota_iva"]').forEach(inp => {
        inp.addEventListener('input', () => updateTotals(p.items));
        inp.addEventListener('change', () => updateTotals(p.items));
      });

      // Cargar comentarios y adjuntos
      loadComentarios(pid);
      loadAdjuntos(pid);

      document.getElementById('btn-send-comment')?.addEventListener('click', () => sendComentario(pid));
      document.getElementById('comment-input')?.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendComentario(pid); }
      });
      document.getElementById('btn-upload')?.addEventListener('click', () => uploadAdjunto(pid));

      document.getElementById('btn-close-detail').addEventListener('click', () => {
        panel.style.display = 'none'; openId = null;
      });

      document.getElementById('btn-guardar')?.addEventListener('click', async () => {
        const btn = document.getElementById('btn-guardar');
        btn.disabled = true; btn.textContent = 'Guardando…';
        await fetch(`/api/presupuestos/${pid}`, {
          method: 'PATCH', headers: authH(),
          body: JSON.stringify({
            items:       getEditedItems(p.items),
            condiciones: document.getElementById('field-condiciones').value,
            notas_ventas: document.getElementById('field-notas-ventas').value,
            validez_dias: parseInt(document.getElementById('field-validez').value)||15,
            usuario_ventas: session.usuario,
          }),
        });
        await load();
        showToast('Cambios guardados');
        btn.disabled = false; btn.textContent = 'Guardar cambios';
      });

      document.getElementById('btn-enviar')?.addEventListener('click', async () => {
        const editedItems = getEditedItems(p.items);
        if (!editedItems.some(i => i.precio_unitario != null)) {
          showToast('Agregá al menos un precio antes de enviar'); return;
        }
        const ok = await showConfirm(
          '¿Enviar presupuesto al cliente?',
          'El cliente recibirá una notificación y podrá aprobarlo o rechazarlo.'
        );
        if (!ok) return;
        // Guardar primero si hay cambios
        await fetch(`/api/presupuestos/${pid}`, {
          method: 'PATCH', headers: authH(),
          body: JSON.stringify({
            items: editedItems,
            condiciones: document.getElementById('field-condiciones').value,
            notas_ventas: document.getElementById('field-notas-ventas').value,
            validez_dias: parseInt(document.getElementById('field-validez').value)||15,
            usuario_ventas: session.usuario,
          }),
        });
        await fetch(`/api/presupuestos/${pid}/enviar`, { method: 'POST', headers: authH() });
        await load();
        panel.style.display = 'none';
        showToast('Presupuesto enviado al cliente');
      });

      document.getElementById('estado-select')?.addEventListener('change', async e => {
        const estado = e.target.value;
        if (!estado) return;
        await fetch(`/api/presupuestos/${pid}/estado`, {
          method: 'PATCH', headers: authH(), body: JSON.stringify({ estado }),
        });
        await load();
        if (openId === pid) openDetail(pid);
        showToast(`Estado actualizado: ${ESTADO_LABELS[estado]}`);
      });
    }

    function getEditedItems(originalItems) {
      const rows = document.querySelectorAll('#items-table tbody tr');
      return originalItems.map((item, idx) => {
        const row    = rows[idx];
        const rawP   = row.querySelector('[data-field="precio_unitario"]').value;
        const precio = rawP !== '' ? parseFloat(rawP) : null;
        const dto    = parseFloat(row.querySelector('[data-field="descuento"]').value) || 0;
        const aliq   = parseFloat(row.querySelector('[data-field="alicuota_iva"]').value) ?? 21;
        const tiempo = row.querySelector('[data-field="tiempo_entrega"]').value;
        const neto   = precio != null ? Math.round(precio * (1 - dto/100) * item.qty * 100) / 100 : null;
        const iva    = neto != null && aliq > 0 ? Math.round(neto * aliq / 100 * 100) / 100 : 0;
        return {
          ...item,
          tiempo_entrega:  tiempo,
          precio_unitario: precio,
          descuento:       dto,
          alicuota_iva:    aliq,
          subtotal_neto:   neto,
          iva_monto:       iva,
          subtotal:        neto != null ? Math.round((neto + iva) * 100) / 100 : null,
        };
      });
    }

    function calcBreakdown(items) {
      const b = { neto_gravado: 0, neto_exento: 0, iva_21: 0, iva_105: 0, iva_27: 0 };
      items.forEach(i => {
        const precio = parseFloat(document.querySelector(`#items-table tbody tr:nth-child(${items.indexOf(i)+1}) [data-field="precio_unitario"]`)?.value) || i.precio_unitario || 0;
        const dto    = parseFloat(document.querySelector(`#items-table tbody tr:nth-child(${items.indexOf(i)+1}) [data-field="descuento"]`)?.value) ?? (i.descuento || 0);
        const aliq   = parseFloat(document.querySelector(`#items-table tbody tr:nth-child(${items.indexOf(i)+1}) [data-field="alicuota_iva"]`)?.value) ?? (i.alicuota_iva ?? 21);
        const neto   = precio * (1 - dto/100) * i.qty;
        if (aliq === 0) { b.neto_exento += neto; }
        else {
          b.neto_gravado += neto;
          if (aliq === 21)   b.iva_21  += neto * 0.21;
          if (aliq === 10.5) b.iva_105 += neto * 0.105;
          if (aliq === 27)   b.iva_27  += neto * 0.27;
        }
      });
      b.total = b.neto_gravado + b.neto_exento + b.iva_21 + b.iva_105 + b.iva_27;
      return b;
    }

    function updateTotals(items) {
      const rows = document.querySelectorAll('#items-table tbody tr');
      items.forEach((item, idx) => {
        const row    = rows[idx];
        if (!row) return;
        const precio = parseFloat(row.querySelector('[data-field="precio_unitario"]')?.value) || null;
        const dto    = parseFloat(row.querySelector('[data-field="descuento"]')?.value) || 0;
        const aliq   = parseFloat(row.querySelector('[data-field="alicuota_iva"]')?.value) ?? 21;
        if (precio == null) { row.querySelector('.subtotal-cell').textContent = '—'; return; }
        const neto = precio * (1 - dto/100) * item.qty;
        const iva  = aliq > 0 ? neto * aliq / 100 : 0;
        row.querySelector('.subtotal-cell').textContent = '$' + fmt(neto + iva);
      });

      const b = calcBreakdown(items);
      const hasAny = items.some((_, idx) => {
        const row = rows[idx];
        return row && parseFloat(row.querySelector('[data-field="precio_unitario"]')?.value) > 0;
      });

      const tfoot = document.getElementById('iva-tfoot');
      if (!hasAny || !tfoot) return;
      const rows2 = [
        b.neto_gravado  > 0 ? `<tr><td colspan="6" style="text-align:right;font-size:var(--text-xs);color:var(--text-muted);padding:2px var(--space-3)">Neto gravado</td><td style="text-align:right;padding:2px var(--space-3)">$${fmt(b.neto_gravado)}</td></tr>` : '',
        b.neto_exento   > 0 ? `<tr><td colspan="6" style="text-align:right;font-size:var(--text-xs);color:var(--text-muted);padding:2px var(--space-3)">Neto exento</td><td style="text-align:right;padding:2px var(--space-3)">$${fmt(b.neto_exento)}</td></tr>` : '',
        b.iva_21        > 0 ? `<tr><td colspan="6" style="text-align:right;font-size:var(--text-xs);color:var(--text-muted);padding:2px var(--space-3)">IVA 21%</td><td style="text-align:right;padding:2px var(--space-3)">$${fmt(b.iva_21)}</td></tr>` : '',
        b.iva_105       > 0 ? `<tr><td colspan="6" style="text-align:right;font-size:var(--text-xs);color:var(--text-muted);padding:2px var(--space-3)">IVA 10.5%</td><td style="text-align:right;padding:2px var(--space-3)">$${fmt(b.iva_105)}</td></tr>` : '',
        b.iva_27        > 0 ? `<tr><td colspan="6" style="text-align:right;font-size:var(--text-xs);color:var(--text-muted);padding:2px var(--space-3)">IVA 27%</td><td style="text-align:right;padding:2px var(--space-3)">$${fmt(b.iva_27)}</td></tr>` : '',
        `<tr style="font-weight:700;font-size:var(--text-base);border-top:2px solid var(--border)"><td colspan="6" style="text-align:right;padding:var(--space-3)">Total</td><td style="text-align:right;padding:var(--space-3)">$${fmt(b.total)}</td></tr>`,
      ].filter(Boolean).join('');
      tfoot.innerHTML = rows2;
    }

    // ── Comentarios ───────────────────────────────────────────
    async function loadComentarios(pid) {
      const r    = await fetch(`/api/presupuestos/${pid}/comentarios`, { headers: authH() });
      const list = await r.json();
      const el   = document.getElementById('comments-thread');
      if (!el) return;
      if (!list.length) { el.innerHTML = '<small style="color:var(--text-muted)">Sin comentarios aún.</small>'; return; }
      el.innerHTML = list.map(c => {
        const cls = c.es_interno ? 'interno' : (c.rol === 'cliente' ? 'cliente' : 'ventas');
        return `<div>
          <div class="comment-bubble comment-bubble--${cls}">${c.texto}${c.es_interno ? ' 🔒' : ''}</div>
          <div class="comment-meta" style="text-align:${c.rol==='cliente'?'left':'right'}">${c.autor} · ${fmtDate(c.fecha)}</div>
        </div>`;
      }).join('');
      el.scrollTop = el.scrollHeight;
    }

    async function sendComentario(pid) {
      const input   = document.getElementById('comment-input');
      const texto   = input.value.trim();
      const interno = document.getElementById('chk-interno')?.checked;
      if (!texto) return;
      await fetch(`/api/presupuestos/${pid}/comentarios`, {
        method: 'POST', headers: authH(),
        body: JSON.stringify({ texto, es_interno: interno }),
      });
      input.value = '';
      loadComentarios(pid);
    }

    // ── Adjuntos ──────────────────────────────────────────────
    async function loadAdjuntos(pid) {
      const r    = await fetch(`/api/presupuestos/${pid}/adjuntos`, { headers: authH() });
      const list = await r.json();
      const el   = document.getElementById('adjuntos-list');
      if (!el) return;
      if (!list.length) { el.innerHTML = '<small style="color:var(--text-muted)">Sin archivos adjuntos.</small>'; return; }
      el.innerHTML = list.map(a => `
        <div class="adjunto-row">
          <span class="adjunto-row__name" title="${a.nombre}">📎 ${a.nombre}</span>
          <span class="adjunto-row__meta">${a.subido_por} · ${fmtDate(a.fecha)} · ${fmtSize(a.tamano)}</span>
          <a class="btn-download" href="/api/presupuestos/${pid}/adjuntos/${a.id}?token=${encodeURIComponent(sessionStorage.getItem('isumos_token'))}" download="${a.nombre}">Descargar</a>
        </div>`).join('');
    }

    async function uploadAdjunto(pid) {
      const file = document.getElementById('adjunto-file')?.files[0];
      if (!file) return;
      const btn  = document.getElementById('btn-upload');
      btn.disabled = true; btn.textContent = 'Subiendo…';
      const form = new FormData();
      form.append('file', file);
      await fetch(`/api/presupuestos/${pid}/adjuntos`, {
        method: 'POST', headers: { Authorization: `Bearer ${token}` }, body: form,
      });
      document.getElementById('adjunto-file').value = '';
      btn.disabled = false; btn.textContent = 'Subir archivo';
      loadAdjuntos(pid);
    }

    function fmtSize(bytes) {
      if (!bytes) return '';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
      return (bytes/1048576).toFixed(1) + ' MB';
    }

    // ── SSE ───────────────────────────────────────────────────
    function connectSSE() {
      const es  = new EventSource(`/api/events?token=${encodeURIComponent(token)}`);
      const dot = document.getElementById('sse-dot');
      es.onopen    = () => { dot.style.background = 'var(--success)'; };
      es.onmessage = (e) => {
        const ev = JSON.parse(e.data);
        if (ev.tipo === 'nuevo_presupuesto') {
          load();
          showToast(`Nuevo presupuesto de ${ev.empresa_nombre}`);
        }
        if (ev.tipo === 'presupuesto_aprobado') {
          load(); showToast(`${ev.empresa_nombre} aprobó el presupuesto`);
        }
        if (ev.tipo === 'presupuesto_rechazado') {
          load(); showToast(`${ev.empresa_nombre} rechazó el presupuesto`);
        }
        if (ev.tipo === 'nuevo_comentario' && ev.para === 'ventas') {
          if (openId === ev.presupuesto_id) loadComentarios(ev.presupuesto_id);
          showToast(`Nuevo mensaje de ${ev.autor}`);
        }
        if (ev.tipo === 'nuevo_adjunto') {
          if (openId === ev.presupuesto_id) loadAdjuntos(ev.presupuesto_id);
        }
      };
      es.onerror = () => { dot.style.background = 'var(--danger)'; es.close(); setTimeout(connectSSE, 5000); };
    }

    // ── Helpers ───────────────────────────────────────────────
    function showConfirm(msg, sub) {
      return new Promise(resolve => {
        document.getElementById('confirm-msg').textContent = msg;
        document.getElementById('confirm-sub').textContent = sub || '';
        const overlay = document.getElementById('confirm-overlay');
        overlay.style.display = 'flex';
        function onOk()     { cleanup(); resolve(true);  }
        function onCancel() { cleanup(); resolve(false); }
        function cleanup() {
          overlay.style.display = 'none';
          document.getElementById('confirm-ok').removeEventListener('click', onOk);
          document.getElementById('confirm-cancel').removeEventListener('click', onCancel);
        }
        document.getElementById('confirm-ok').addEventListener('click', onOk);
        document.getElementById('confirm-cancel').addEventListener('click', onCancel);
      });
    }

    function fmtDate(iso) {
      return new Date(iso).toLocaleString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
    }
    function fmt(n) {
      return Number(n).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('toast--visible');
      clearTimeout(t._t);
      t._t = setTimeout(() => t.classList.remove('toast--visible'), 4000);
    }

    load();
    connectSSE();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clientes — Isumos</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: var(--font-sans); background: var(--bg); color: var(--text-primary); margin: 0; }
    .header { position: sticky; top: 0; z-index: 100; height: var(--header-height); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 var(--space-6); gap: var(--space-4); }
    .header__brand { font-size: var(--text-lg); font-weight: var(--font-bold); color: var(--accent); }
    .header__title { font-size: var(--text-base); font-weight: var(--font-semibold); color: var(--text-secondary); }
    .header__sep { flex: 1; }
    .btn-nav { font-size: var(--text-sm); padding: var(--space-2) var(--space-3); border: 1px solid var(--border); border-radius: var(--radius); background: none; color: var(--text-secondary); text-decoration: none; cursor: pointer; transition: background var(--transition); }
    .btn-nav:hover { background: var(--bg-subtle); }
    .main { max-width: 960px; margin: 0 auto; padding: var(--space-6); }
    .page-header { display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-6); }
    .page-title { font-size: var(--text-xl); font-weight: var(--font-bold); flex: 1; }
    .btn-primary { padding: var(--space-2) var(--space-5); background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-size: var(--text-sm); font-weight: 600; cursor: pointer; }
    .btn-primary:hover { background: var(--accent-hover); }
    .search-input { padding: var(--space-2) var(--space-3); border: 1px solid var(--border); border-radius: var(--radius); font-size: var(--text-sm); font-family: inherit; width: 240px; }
    .search-input:focus { outline: none; border-color: var(--accent); }

    /* ── Empresas list ── */
    .empresa-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-4) var(--space-5); margin-bottom: var(--space-3); display: flex; align-items: flex-start; gap: var(--space-4); }
    .empresa-card__info { flex: 1; }
    .empresa-card__nombre { font-weight: var(--font-semibold); font-size: var(--text-base); }
    .empresa-card__meta   { font-size: var(--text-sm); color: var(--text-muted); margin-top: var(--space-1); }
    .empresa-card__actions { display: flex; gap: var(--space-2); flex-shrink: 0; }
    .btn-sm { font-size: var(--text-xs); font-weight: 600; padding: 4px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: none; color: var(--text-secondary); cursor: pointer; }
    .btn-sm:hover { background: var(--bg-subtle); }
    .btn-sm--accent { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-sm--accent:hover { background: var(--accent-hover); }
    .badge-inactiva { font-size: 10px; padding: 2px 8px; border-radius: 999px; background: var(--danger-light); color: var(--danger); font-weight: 600; }

    /* ── Modal / Drawer ── */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; display: flex; align-items: center; justify-content: center; padding: var(--space-4); opacity: 0; transition: opacity .2s; pointer-events: none; }
    .overlay.open { opacity: 1; pointer-events: all; }
    .modal { background: var(--surface); border-radius: var(--radius-lg); max-width: 520px; width: 100%; padding: var(--space-6); position: relative; }
    .modal__title { font-size: var(--text-lg); font-weight: var(--font-bold); margin-bottom: var(--space-5); }
    .form-field { margin-bottom: var(--space-4); }
    .form-field label { display: block; font-size: var(--text-xs); font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: var(--space-1); }
    .form-field input { width: 100%; padding: var(--space-2) var(--space-3); border: 1px solid var(--border); border-radius: var(--radius); font-size: var(--text-sm); font-family: inherit; }
    .form-field input:focus { outline: none; border-color: var(--accent); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
    .modal__actions { display: flex; gap: var(--space-3); justify-content: flex-end; margin-top: var(--space-5); }
    .btn-cancel { padding: var(--space-2) var(--space-5); border: 1px solid var(--border); border-radius: var(--radius); font-size: var(--text-sm); background: none; color: var(--text-secondary); cursor: pointer; }
    .divider { border: none; border-top: 1px solid var(--border); margin: var(--space-5) 0; }
    .section-title { font-size: var(--text-sm); font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: var(--space-3); }
    .msg { font-size: var(--text-sm); padding: var(--space-2) var(--space-3); border-radius: var(--radius); margin-bottom: var(--space-3); }
    .msg--ok  { background: var(--success-light); color: var(--success); }
    .msg--err { background: var(--danger-light);  color: var(--danger); }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
    .empty-state { text-align: center; padding: var(--space-12); color: var(--text-muted); font-size: var(--text-sm); }
  </style>
</head>
<body>
  <header class="header">
    <img src="assets/img/logo-global.png" alt="Farmacias Global" style="height:42px">
    <span class="header__title">/ Clientes</span>
    <div class="header__sep"></div>
    <a href="./ventas.html" class="btn-nav">← Ventas</a>
    <button class="btn-nav" id="btn-logout">Salir</button>
  </header>

  <main class="main">
    <div class="page-header">
      <h1 class="page-title">Empresas clientes</h1>
      <input class="search-input" id="search" type="search" placeholder="Buscar empresa…" />
      <button class="btn-primary" id="btn-nueva">+ Nueva empresa</button>
    </div>
    <div id="lista"></div>
  </main>

  <!-- Modal empresa -->
  <div class="overlay" id="overlay-empresa">
    <div class="modal">
      <h2 class="modal__title" id="modal-title">Nueva empresa</h2>
      <div class="msg" id="modal-msg" style="display:none"></div>
      <div class="form-grid">
        <div class="form-field" style="grid-column:1/-1">
          <label>Nombre *</label>
          <input type="text" id="f-nombre" placeholder="Ej: Farmacia Del Pueblo S.A." />
        </div>
        <div class="form-field">
          <label>CUIT</label>
          <input type="text" id="f-cuit" placeholder="20-12345678-9" />
        </div>
        <div class="form-field">
          <label>Email</label>
          <input type="email" id="f-email" placeholder="compras@empresa.com" />
        </div>
        <div class="form-field">
          <label>Teléfono</label>
          <input type="tel" id="f-telefono" />
        </div>
        <div class="form-field">
          <label>Dirección</label>
          <input type="text" id="f-direccion" />
        </div>
      </div>

      <hr class="divider" id="divider-usuario" />
      <div id="section-usuario">
        <p class="section-title">Usuario de acceso al portal</p>
        <div class="form-grid">
          <div class="form-field">
            <label>Usuario *</label>
            <input type="text" id="f-usuario" placeholder="ej: farmadelpueblo" autocomplete="off" />
          </div>
          <div class="form-field">
            <label>Contraseña *</label>
            <input type="password" id="f-password" autocomplete="new-password" />
          </div>
        </div>
      </div>

      <div class="modal__actions">
        <button class="btn-cancel" id="btn-cancel">Cancelar</button>
        <button class="btn-primary" id="btn-guardar-empresa">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal agregar usuario a empresa existente -->
  <div class="overlay" id="overlay-usuario">
    <div class="modal">
      <h2 class="modal__title">Agregar usuario a <span id="modal-empresa-nombre"></span></h2>
      <div class="msg" id="modal-usr-msg" style="display:none"></div>
      <div class="form-grid">
        <div class="form-field">
          <label>Usuario *</label>
          <input type="text" id="fu-usuario" autocomplete="off" />
        </div>
        <div class="form-field">
          <label>Contraseña *</label>
          <input type="password" id="fu-password" autocomplete="new-password" />
        </div>
      </div>
      <div class="modal__actions">
        <button class="btn-cancel" id="btn-cancel-usr">Cancelar</button>
        <button class="btn-primary" id="btn-guardar-usuario">Guardar</button>
      </div>
    </div>
  </div>

  <script type="module">
    import auth from './js/auth.js';

    const session = await auth.requireAuth();
    if (!session) throw new Error();
    if (!['ventas','deposito'].includes(session.rol)) { window.location.href='./login.html'; throw new Error(); }
    document.getElementById('btn-logout').addEventListener('click', () => auth.logout());

    const token = sessionStorage.getItem('isumos_token');
    function authH() { return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }; }

    let empresas = [];
    let editingId = null;
    let addUserEmpresaId = null;

    async function load() {
      const r = await fetch('/api/empresas', { headers: authH() });
      empresas = await r.json();
      render();
    }

    function filtered() {
      const q = document.getElementById('search').value.toLowerCase();
      return q ? empresas.filter(e => e.nombre.toLowerCase().includes(q) || (e.cuit||'').includes(q)) : empresas;
    }

    function render() {
      const list = filtered();
      const el   = document.getElementById('lista');
      if (!list.length) {
        el.innerHTML = '<div class="empty-state">No hay empresas cargadas. Creá la primera.</div>';
        return;
      }
      el.innerHTML = list.map(e => `
        <div class="empresa-card">
          <div class="empresa-card__info">
            <div class="empresa-card__nombre">
              ${e.nombre}
              ${!e.activa ? '<span class="badge-inactiva">Inactiva</span>' : ''}
            </div>
            <div class="empresa-card__meta">
              ${[e.cuit, e.email, e.telefono].filter(Boolean).join(' · ') || 'Sin datos adicionales'}
            </div>
          </div>
          <div class="empresa-card__actions">
            <button class="btn-sm btn-add-user" data-id="${e.id}" data-nombre="${e.nombre}">+ Usuario</button>
            <button class="btn-sm btn-edit" data-id="${e.id}">Editar</button>
            <button class="btn-sm btn-toggle" data-id="${e.id}" data-activa="${e.activa}">${e.activa?'Desactivar':'Activar'}</button>
          </div>
        </div>`).join('');

      el.querySelectorAll('.btn-edit').forEach(btn => openEditModal(btn.dataset.id));
      el.querySelectorAll('.btn-edit').forEach(btn => {
        btn.addEventListener('click', () => openEditModal(btn.dataset.id));
      });
      el.querySelectorAll('.btn-toggle').forEach(btn => {
        btn.addEventListener('click', async () => {
          await fetch(`/api/empresas/${btn.dataset.id}`, {
            method: 'PATCH', headers: authH(),
            body: JSON.stringify({ activa: btn.dataset.activa==='1'?0:1 }),
          });
          load();
        });
      });
      el.querySelectorAll('.btn-add-user').forEach(btn => {
        btn.addEventListener('click', () => {
          addUserEmpresaId = btn.dataset.id;
          document.getElementById('modal-empresa-nombre').textContent = btn.dataset.nombre;
          document.getElementById('fu-usuario').value = '';
          document.getElementById('fu-password').value = '';
          showMsg('modal-usr-msg', '', '');
          document.getElementById('overlay-usuario').classList.add('open');
        });
      });
    }

    document.getElementById('search').addEventListener('input', render);

    // ── Modal empresa ─────────────────────────────────────────
    function openNewModal() {
      editingId = null;
      document.getElementById('modal-title').textContent = 'Nueva empresa';
      ['nombre','cuit','email','telefono','direccion','usuario','password'].forEach(f => {
        document.getElementById(`f-${f}`).value = '';
      });
      document.getElementById('section-usuario').style.display = '';
      document.getElementById('divider-usuario').style.display = '';
      showMsg('modal-msg', '', '');
      document.getElementById('overlay-empresa').classList.add('open');
    }

    function openEditModal(id) {
      const e = empresas.find(x => x.id === id);
      if (!e) return;
      editingId = id;
      document.getElementById('modal-title').textContent = 'Editar empresa';
      document.getElementById('f-nombre').value    = e.nombre    || '';
      document.getElementById('f-cuit').value      = e.cuit      || '';
      document.getElementById('f-email').value     = e.email     || '';
      document.getElementById('f-telefono').value  = e.telefono  || '';
      document.getElementById('f-direccion').value = e.direccion || '';
      document.getElementById('section-usuario').style.display = 'none';
      document.getElementById('divider-usuario').style.display = 'none';
      showMsg('modal-msg', '', '');
      document.getElementById('overlay-empresa').classList.add('open');
    }

    function closeEmpresaModal() { document.getElementById('overlay-empresa').classList.remove('open'); }
    function closeUsuarioModal() { document.getElementById('overlay-usuario').classList.remove('open'); }

    document.getElementById('btn-nueva').addEventListener('click', openNewModal);
    document.getElementById('btn-cancel').addEventListener('click', closeEmpresaModal);
    document.getElementById('overlay-empresa').addEventListener('click', e => { if (e.target.id === 'overlay-empresa') closeEmpresaModal(); });
    document.getElementById('btn-cancel-usr').addEventListener('click', closeUsuarioModal);
    document.getElementById('overlay-usuario').addEventListener('click', e => { if (e.target.id === 'overlay-usuario') closeUsuarioModal(); });

    document.getElementById('btn-guardar-empresa').addEventListener('click', async () => {
      const nombre = document.getElementById('f-nombre').value.trim();
      if (!nombre) { showMsg('modal-msg', 'El nombre es obligatorio', 'err'); return; }

      const btn = document.getElementById('btn-guardar-empresa');
      btn.disabled = true; btn.textContent = 'Guardando…';

      if (editingId) {
        await fetch(`/api/empresas/${editingId}`, {
          method: 'PATCH', headers: authH(),
          body: JSON.stringify({
            nombre, cuit: document.getElementById('f-cuit').value,
            email: document.getElementById('f-email').value,
            telefono: document.getElementById('f-telefono').value,
            direccion: document.getElementById('f-direccion').value,
          }),
        });
        closeEmpresaModal();
        load();
      } else {
        // Crear empresa
        const r = await fetch('/api/empresas', {
          method: 'POST', headers: authH(),
          body: JSON.stringify({
            nombre, cuit: document.getElementById('f-cuit').value,
            email: document.getElementById('f-email').value,
            telefono: document.getElementById('f-telefono').value,
            direccion: document.getElementById('f-direccion').value,
          }),
        });
        const data = await r.json();
        if (!data.ok) { showMsg('modal-msg', 'Error al crear empresa', 'err'); btn.disabled=false; btn.textContent='Guardar'; return; }

        // Crear usuario si se completó
        const usuario  = document.getElementById('f-usuario').value.trim();
        const password = document.getElementById('f-password').value;
        if (usuario && password) {
          const ur = await fetch(`/api/empresas/${data.id}/usuario`, {
            method: 'POST', headers: authH(), body: JSON.stringify({ usuario, password }),
          });
          const ud = await ur.json();
          if (!ud.ok) { showMsg('modal-msg', ud.motivo === 'usuario_existe' ? 'Ese usuario ya existe' : 'Empresa creada pero error al crear usuario', 'err'); btn.disabled=false; btn.textContent='Guardar'; load(); return; }
        }
        closeEmpresaModal();
        load();
      }
      btn.disabled = false; btn.textContent = 'Guardar';
    });

    document.getElementById('btn-guardar-usuario').addEventListener('click', async () => {
      const usuario  = document.getElementById('fu-usuario').value.trim();
      const password = document.getElementById('fu-password').value;
      if (!usuario || !password) { showMsg('modal-usr-msg', 'Completá usuario y contraseña', 'err'); return; }
      const btn = document.getElementById('btn-guardar-usuario');
      btn.disabled = true; btn.textContent = 'Guardando…';
      const r    = await fetch(`/api/empresas/${addUserEmpresaId}/usuario`, {
        method: 'POST', headers: authH(), body: JSON.stringify({ usuario, password }),
      });
      const data = await r.json();
      if (!data.ok) {
        showMsg('modal-usr-msg', data.motivo === 'usuario_existe' ? 'Ese usuario ya existe' : 'Error al crear usuario', 'err');
      } else {
        closeUsuarioModal();
      }
      btn.disabled = false; btn.textContent = 'Guardar';
    });

    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      if (!text) { el.style.display = 'none'; return; }
      el.textContent = text;
      el.className = `msg msg--${type}`;
      el.style.display = '';
    }

    load();
  </script>
</body>
</html>
